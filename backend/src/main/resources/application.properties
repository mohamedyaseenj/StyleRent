spring.application.name=stylerent-backend

server.port=8080

# Active profile: dev by default, override with SPRING_PROFILES_ACTIVE or -Dspring.profiles.active
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------------------------------------------------------------------------
# PostgreSQL on Render (used by every profile unless overridden).
# Password is NEVER committed: set the DB_PASSWORD environment variable.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://dpg-db5mrst9fdbs73ddr800-a.oregon-postgres.render.com:5432/stylerentdb?sslmode=require
spring.datasource.username=${DB_USERNAME:stylerentdb_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate must NOT create or drop the existing database. Validate only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# JWT
# The secret is read from the JWT_SECRET environment variable. The inline
# default is a DEVELOPMENT-ONLY placeholder; overwrite it for any real use.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:styleRent-dev-secret-key-please-change-in-production-0123456789abcdef}
app.jwt.expiration-ms=86400000

# ---------------------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# JSON serialization
# ---------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null