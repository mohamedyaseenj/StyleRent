# Local validation profile - used for CI-style validation runs against an
# isolated MySQL instance (throwaway server on port 3307, root with no
# password). Real deployments use the default (dev) profile on port 3306 with
# DB_USERNAME / DB_PASSWORD environment variables.
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/stylerentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.show-sql=false