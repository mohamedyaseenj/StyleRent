# Development environment (the real StyleRent PostgreSQL on the default port 5432).
# Credentials are read from environment variables and never hard-coded.
spring.datasource.url=jdbc:postgresql://localhost:5432/stylerentdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true