# Local validation profile - used for CI-style validation runs against an
# isolated PostgreSQL instance (throwaway server on port 5433, postgres with
# no password). Real deployments use the default (dev) profile on port 5432
# with DB_USERNAME / DB_PASSWORD environment variables.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/stylerentdb
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.show-sql=false