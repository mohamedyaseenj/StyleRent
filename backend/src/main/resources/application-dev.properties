# Development environment (the real StyleRent MySQL on the default port 3306).
# Credentials are read from environment variables and never hard-coded.
spring.datasource.url=jdbc:mysql://localhost:3306/stylerentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true